# 免費部署：GitHub Pages（靜態網站）
# - 推送程式、每 30 分鐘排程、或在 Actions 頁按「Run workflow」時，
#   從 Google 試算表重新讀取內容並發布。
# - 試算表 ID 預設寫在下方 GOOGLE_SHEET_ID；也可在 Settings → Secrets and variables → Actions → Variables 設 GOOGLE_SHEET_ID 覆蓋
name: 更新並發布網站

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 115/11/12 暫停讀試算表（線上試算表仍是舊內容），先用 content/seed 的最新內容。
      # 匯入新管理表後，把下一行的 '' 改回 '1ZfE_8lQnOd3VONuA2qdo75szfcUJxOolg6Nc_tx0euI' 即恢復。
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      SITE_PREVIEW_MODE: "false"
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            keelung-fish-education/package-lock.json
      - run: npm ci
      - name: 內容檢核（結果顯示在本次執行的 Summary）
        run: npm run content-report
      - name: 建置靜態網站
        run: npm run build:static
      # ── 潮境共學｜基隆食魚教育（子網站：/keelung-fish-education/）──
      - name: 食魚教育網站：安裝
        working-directory: keelung-fish-education
        run: npm ci
      - name: 食魚教育網站：內容檢核（結果顯示在本次執行的 Summary）
        working-directory: keelung-fish-education
        env:
          FISH_SHEET_ID: ${{ vars.FISH_SHEET_ID || '' }}
        run: npm run content-report
      - name: 食魚教育網站：建置
        working-directory: keelung-fish-education
        env:
          FISH_SHEET_ID: ${{ vars.FISH_SHEET_ID || '' }}
          NEXT_PUBLIC_BASE_PATH: /keelung-fish-education
        run: npm run build
      - name: 合併兩個網站
        run: |
          rm -rf out/keelung-fish-education
          cp -r keelung-fish-education/out out/keelung-fish-education
          test -f out/keelung-fish-education/index.html
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      # GitHub 會停用 60 天沒有活動的公開儲存庫排程；每次執行時重新啟用本流程，避免自動更新停擺。
      - name: 維持排程啟用
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 確認網站已上線
        run: |
          sleep 20
          base="https://${{ github.repository_owner }}.github.io"
          for p in / /activities/ /results/115/ /media/115/0816-training-sup-group.jpg /keelung-fish-education/ /keelung-fish-education/results/115/ /keelung-fish-education/missions/ /keelung-fish-education/downloads/bdz-fish-handbook-a5-16p.pdf; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p")
            echo "$p → $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -s "$base/" | grep -o '<title>[^<]*' | head -1
          curl -s "$base/" | grep -q '基隆海洋運動俱樂部' && echo "首頁內容正確"
